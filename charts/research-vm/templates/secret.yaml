{{- /*
  The VM's local account password, generated once and kept across upgrades. It satisfies
  Azure's complexity rules: 24 characters with upper, lower, digit and symbol classes.
  The Secret doubles as the access gateway's connection record (label kubetre.io/connection);
  the gateway reads the VM's private IP from the ResearchVM once Azure assigns it.
*/ -}}
{{- $name := printf "%s-credentials" (include "rvm.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := printf "%s%s%s%s" (randAlpha 9 | upper) (randAlpha 9 | lower) (randNumeric 4) "#!" -}}
{{- if and $existing $existing.data }}{{ $password = index $existing.data "password" | b64dec }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "rvm.labels" . | nindent 4 }}
    kubetre.io/connection: "true"
  annotations:
    kubetre.io/owner: {{ .Values.kubetre.owner | quote }}
    kubetre.io/host-from-researchvm: {{ include "rvm.name" . }}
type: Opaque
stringData:
  protocol: {{ if eq .Values.os "windows" }}rdp{{ else }}ssh{{ end }}
  port: {{ if eq .Values.os "windows" }}"3389"{{ else }}"22"{{ end }}
  username: {{ .Values.username | quote }}
  password: {{ $password | quote }}
