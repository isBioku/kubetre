apiVersion: v1
kind: ConfigMap
metadata:
  name: kubetre-gateway
  namespace: kubetre-gateway
data:
  EXTERNAL_URL: "https://gateway.example.org"
  OIDC_ISSUER: "https://idp.example.org/realms/tre"
  OIDC_CLIENT_ID: "kubetre-gateway"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: kubetre-gateway
  labels: {app.kubernetes.io/name: broker, app.kubernetes.io/part-of: kubetre-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: broker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: broker, app.kubernetes.io/part-of: kubetre-gateway}
    spec:
      serviceAccountName: kubetre-gateway-broker
      nodeSelector: {kubetre.io/node-pool: gateway}
      tolerations: [{key: kubetre.io/node-pool, operator: Equal, value: gateway, effect: NoSchedule}]
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: broker
          image: kubetre/gateway:dev
          args:
            - --listen=:8080
            - --external-url=$(EXTERNAL_URL)
            - --oidc-issuer=$(OIDC_ISSUER)
            - --oidc-client-id=$(OIDC_CLIENT_ID)
          envFrom: [{configMapRef: {name: kubetre-gateway}}]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: kubetre-gateway-oidc, key: client-secret, optional: true}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: kubetre-gateway
spec:
  selector: {app.kubernetes.io/name: broker}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Stock Apache Guacamole web application with only the encrypted-JSON authentication
# extension enabled (it is switched on by JSON_SECRET_KEY). It has no other login.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: kubetre-gateway
  labels: {app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: kubetre-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: guacamole}
  template:
    metadata:
      labels: {app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: kubetre-gateway}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubetre.io/node-pool: gateway}
      tolerations: [{key: kubetre.io/node-pool, operator: Equal, value: gateway, effect: NoSchedule}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0
          env:
            - {name: GUACD_HOSTNAME, value: guacd}
            - {name: GUACD_PORT, value: "4822"}
            - {name: REMOTE_IP_VALVE_ENABLED, value: "true"}
            - name: JSON_SECRET_KEY
              valueFrom: {secretKeyRef: {name: kubetre-gateway-keys, key: json-secret-key}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /guacamole/, port: http}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /guacamole/, port: http}, initialDelaySeconds: 60, periodSeconds: 30}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            # Tomcat writes its runtime files into the image's home directory.
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: kubetre-gateway
spec:
  selector: {app.kubernetes.io/name: guacamole}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# guacd opens the actual RDP, SSH and VNC connections. It runs only on the gateway pool,
# whose pod subnet is the single source workspace VM NSGs accept.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: kubetre-gateway
  labels: {app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: kubetre-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: guacd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: kubetre-gateway}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubetre.io/node-pool: gateway}
      tolerations: [{key: kubetre.io/node-pool, operator: Equal, value: gateway, effect: NoSchedule}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0
          ports: [{name: guacd, containerPort: 4822}]
          readinessProbe: {tcpSocket: {port: guacd}}
          livenessProbe: {tcpSocket: {port: guacd}, periodSeconds: 30}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            # FreeRDP keeps its certificate store under the home directory.
            - {name: home, mountPath: /home/guacd}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: home, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: kubetre-gateway
spec:
  selector: {app.kubernetes.io/name: guacd}
  ports: [{name: guacd, port: 4822, targetPort: guacd}]
