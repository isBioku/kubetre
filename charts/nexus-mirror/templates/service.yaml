# Workspace pods use the cluster address; workspace VMs use the internal load balancer, whose
# address is in the shared services subnet that VM security groups allow on port 80.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.name" . }}
  labels: {{- include "nexus.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    {{- with .Values.service.subnet }}
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: {{ . | quote }}
    {{- end }}
    {{- with .Values.service.loadBalancerIP }}
    service.beta.kubernetes.io/azure-load-balancer-ipv4: {{ . | quote }}
    {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: nexus-mirror}
  ports:
    - {name: http, port: 80, targetPort: http}
