{{- $name := printf "%s-admin" (include "gitea.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existing $existing.data }}{{ $password = index $existing.data "password" | b64dec }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gitea.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: kubetre-admin
  password: {{ $password | quote }}
