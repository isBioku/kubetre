apiVersion: v1
kind: Namespace
metadata:
  name: kubetre-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Shared services such as the package mirror live here. Workspaces may reach this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: kubetre-shared
  labels:
    pod-security.kubernetes.io/enforce: restricted
    kubetre.io/shared-services: "true"
