# Crossplane packages KubeTRE needs. Pin versions; bump them together with the vendored
# CRDs in test/crossplane/testdata so tests validate against what runs in the cluster.
# One runtime config per provider so each runs under a fixed service account name, matching
# the federated identity credentials created by infra/azure/crossplane.tf.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-azure-network
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-azure-network
      annotations:
        # Client ID of the Crossplane user-assigned identity; replaced per environment.
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-azure-compute
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-azure-compute
      annotations:
        # Client ID of the Crossplane user-assigned identity; replaced per environment.
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-network
spec:
  package: xpkg.upbound.io/upbound/provider-azure-network:v2.7.0
  runtimeConfigRef:
    name: provider-azure-network
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-compute
spec:
  package: xpkg.upbound.io/upbound/provider-azure-compute:v2.7.0
  runtimeConfigRef:
    name: provider-azure-compute
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-environment-configs
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs:v0.9.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.13.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
