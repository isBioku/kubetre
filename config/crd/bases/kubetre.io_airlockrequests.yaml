                type: string
              reviewResources:
                additionalProperties:
                  description: AirlockReviewResource is a review VM created for one
                    reviewer.
                  properties:
                    service:
                      type: string
                    userResource:
                      type: string
                    workspace:
                      type: string
                  required:
                  - service
                  - userResource
                  - workspace
                  type: object
                description: ReviewResources are review VMs, keyed by the reviewer's
                  object ID.
                type: object
              reviews:
