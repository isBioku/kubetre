# The AKS Flux extension enforces multi-tenancy: a HelmRelease that names no service account is
# installed as "flux-applier" in its own namespace, which has no rights by default. This
# platform component installs CRDs and cluster-wide RBAC, so its installer gets cluster-admin,
# granted explicitly here for this namespace only. Workspace HelmReleases never use this: they
# name the confined kubetre-deployer account in their own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-applier-crossplane-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects: [{kind: ServiceAccount, name: flux-applier, namespace: crossplane-system}]
