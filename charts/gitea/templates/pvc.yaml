apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gitea.name" . }}-data
  labels: {{- include "gitea.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ printf "%dGi" (int .Values.storageGi) }}
