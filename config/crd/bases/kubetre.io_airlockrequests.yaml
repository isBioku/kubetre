            required:
            - createdBy
            - title
            - type
            type: object
            x-kubernetes-validations:
            - message: an airlock request's spec is immutable
              rule: self == oldSelf
          status:
            description: |-
              AirlockRequestStatus is the request's progress. The API records user actions; the
              controller moves the data and completes the in-progress statuses.
            properties:
              files:
                items:
                  description: AirlockFile is a file in a request.
                  properties:
                    name:
                      type: string
                    size:
                      format: int64
                      type: integer
                  required:
                  - name
                  - size
                  type: object
                type: array
              history:
                items:
                  description: AirlockHistoryItem records a previous state of the
                    request.
                  properties:
                    previousStatus:
                      type: string
                    updatedBy:
                      description: |-
