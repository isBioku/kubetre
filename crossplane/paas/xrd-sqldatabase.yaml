# An Azure SQL database for a workspace, reached through a private endpoint in its subnet. Entra ID sign-in only.
# Created by the azure-paas chart.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: sqldatabases.platform.kubetre.io
spec:
  scope: Namespaced
  group: platform.kubetre.io
  names:
    kind: SQLDatabase
    plural: sqldatabases
  defaultCompositionRef:
    name: sqldatabase-azure
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: Database
      type: string
      jsonPath: .spec.parameters.databaseName
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - parameters
            properties:
              parameters:
                type: object
                required:
                - id
                - skuName
                - maxSizeGb
                - databaseName
                - creator
                properties:
                  id:
                    type: string
                    pattern: ^[a-z0-9]{10}$
                    description: Stable suffix for Azure resource names, derived by the chart from the namespace and release.
                  members:
                    type: array
                    description: Workspace owners and researchers with known Entra object IDs, granted roles on the service.
                    items:
                      type: object
                      required:
                      - objectId
                      - role
                      properties:
                        objectId:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                          - owner
                          - researcher
                  creator:
                    type: object
                    description: Who created the service.
                    properties:
                      objectId:
                        type: string
                      email:
                        type: string
                  skuName:
                    type: string
                    enum:
                    - Basic
                    - S0
                    - S1
                    - GP_S_Gen5_1
                    - GP_S_Gen5_2
                    - GP_S_Gen5_4
                  maxSizeGb:
                    type: integer
                    minimum: 1
                    maximum: 1024
                  databaseName:
                    type: string
                    pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
                x-kubernetes-validations:
                - rule: self.creator.objectId.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
                  message: 'the creator''s Entra object ID is required: they become the server''s Entra administrator'
                - rule: self.id == oldSelf.id
                  message: id is immutable
          status:
            type: object
            properties:
              endpoint:
                type: string
