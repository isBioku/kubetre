# A workspace's private cloud subnet for research VMs. Created only by the KubeTRE
# controller, never by charts. The workspace is derived from the namespace, not a parameter.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: workspacenetworks.platform.kubetre.io
spec:
  scope: Namespaced
  group: platform.kubetre.io
  names:
    kind: WorkspaceNetwork
    plural: workspacenetworks
  defaultCompositionRef:
    name: workspacenetwork-azure
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: object
                  required: [addressPrefix, firewallPriority]
                  properties:
                    addressPrefix:
                      type: string
                      pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: addressPrefix is immutable
                    firewallPriority:
                      type: integer
                      minimum: 1000
                      maximum: 64999
                    allowedFQDNs:
                      type: array
                      maxItems: 200
                      items:
                        type: string
                        pattern: '^(\*\.)?[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
            status:
              type: object
              properties:
                subnetId:
                  type: string
