apiVersion: v1
kind: ConfigMap
metadata:
  name: kubetre-api
  namespace: kubetre-system
data:
  # Point these at your OIDC provider (Keycloak, Entra ID, Dex, ...).
  OIDC_ISSUER: "https://idp.example.com/realms/tre"
  OIDC_AUDIENCE: "kubetre-api"
  ROLES_CLAIM: "roles"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetre-api
  namespace: kubetre-system
  labels: {app.kubernetes.io/name: kubetre-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: kubetre-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kubetre-api}
    spec:
      serviceAccountName: kubetre-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: kubetre/api:dev
          args:
            - --listen=:8080
            - --oidc-issuer=$(OIDC_ISSUER)
            - --oidc-audience=$(OIDC_AUDIENCE)
            - --roles-claim=$(ROLES_CLAIM)
          envFrom: [{configMapRef: {name: kubetre-api}}]
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: kubetre-api
  namespace: kubetre-system
spec:
  selector: {app.kubernetes.io/name: kubetre-api}
  ports: [{name: http, port: 80, targetPort: http}]
