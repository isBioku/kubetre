{{- $name := printf "%s-db" (include "ohdsi.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existing $existing.data }}{{ $password = index $existing.data "password" | b64dec }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ohdsi.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
