# Environment-specific values, substituted by Flux from Terraform outputs (infra/azure/gitops.tf).
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: kubetre-azure
data:
  location: ${LOCATION}
  resourceGroup: ${WORKSPACE_RESOURCE_GROUP}
  virtualNetworkName: ${VNET_NAME}
  vnetResourceGroup: ${VNET_RESOURCE_GROUP}
  routeTableId: ${ROUTE_TABLE_ID}
  firewallPolicyId: ${FIREWALL_POLICY_ID}
  accessGatewayPrefixes: ["${ACCESS_GATEWAY_PREFIX}"]
  sharedServicePrefixes: ["${SHARED_SERVICES_PREFIX}"]
  airlockPrivateIp: ${AIRLOCK_INTERNAL_IP}
  encryptionAtHost: ${ENCRYPTION_AT_HOST}
  vmSizes:
    small: ${VM_SIZE_SMALL}
    medium: ${VM_SIZE_MEDIUM}
    large: ${VM_SIZE_LARGE}
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: OIDCTokenFile
  clientID: ${CROSSPLANE_CLIENT_ID}
  tenantID: ${AZURE_TENANT_ID}
  subscriptionID: ${AZURE_SUBSCRIPTION_ID}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubetre-api
  namespace: kubetre-system
data:
  OIDC_ISSUER: ${OIDC_ISSUER}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE}
  ROLES_CLAIM: ${ROLES_CLAIM}
  API_SCOPE: ""
  GATEWAY_URL: https://${GATEWAY_HOSTNAME}/gateway
  VERSION: ${KUBETRE_VERSION}
  AIRLOCK_EXTERNAL_ACCOUNT: ${AIRLOCK_EXTERNAL_ACCOUNT}
  AIRLOCK_INTERNAL_ACCOUNT: ${AIRLOCK_INTERNAL_ACCOUNT}
  COSTS_CLIENT_ID: ${COSTS_CLIENT_ID}
  COSTS_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}
  COSTS_RESOURCE_GROUPS: ${CORE_RESOURCE_GROUP},${WORKSPACE_RESOURCE_GROUP},${NODE_RESOURCE_GROUP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubetre-controller
  namespace: kubetre-system
data:
  AIRLOCK_EXTERNAL_ACCOUNT: ${AIRLOCK_EXTERNAL_ACCOUNT}
  AIRLOCK_INTERNAL_ACCOUNT: ${AIRLOCK_INTERNAL_ACCOUNT}
  AIRLOCK_MALWARE_SCANNING: ${AIRLOCK_MALWARE_SCANNING}
  UI_URL: https://${GATEWAY_HOSTNAME}
---
# The API and controller use the airlock identity through workload identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetre-api
  namespace: kubetre-system
  annotations:
    azure.workload.identity/client-id: ${AIRLOCK_CLIENT_ID}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetre-controller
  namespace: kubetre-system
  annotations:
    azure.workload.identity/client-id: ${AIRLOCK_CLIENT_ID}
