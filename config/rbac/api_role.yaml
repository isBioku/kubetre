# The API reads templates and manages KubeTRE objects; it never touches namespaces or workloads.
# It reads Services only to report the addresses where workspaces reach their services.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubetre-api
rules:
  - apiGroups: ["kubetre.io"]
    resources: ["workspacetemplates", "servicetemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubetre.io"]
    resources: ["workspaces", "workspaceservices"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Members' Entra object IDs, recorded as they use the TRE.
  - apiGroups: ["kubetre.io"]
    resources: ["workspaces/status"]
    verbs: ["patch"]
  # Airlock requests: the API records what users do; the controller moves the data.
  - apiGroups: ["kubetre.io"]
    resources: ["airlockrequests"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["kubetre.io"]
    resources: ["airlockrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
