apiVersion: v1
kind: ConfigMap
metadata:
  name: kubetre-api
  namespace: kubetre-system
data:
  # Point these at your OIDC provider (Keycloak, Entra ID, Dex, ...).
  OIDC_ISSUER: "https://idp.example.com/realms/tre"
  OIDC_AUDIENCE: "kubetre-api"
  ROLES_CLAIM: "roles"
  # AzureTRE API settings: the scope the UI requests tokens for (default api://<audience>)
  # and the broker URL that user resources' Connect links point at.
  API_SCOPE: ""
  GATEWAY_URL: ""
  VERSION: "dev"
  # The airlock's storage accounts; empty turns the airlock off.
  AIRLOCK_EXTERNAL_ACCOUNT: ""
  AIRLOCK_INTERNAL_ACCOUNT: ""
  # Cost reporting: the Cost Management reader identity, the subscription, and the TRE's
  # resource groups as core,workspaces,cluster. An empty client ID turns it off.
  COSTS_CLIENT_ID: ""
  COSTS_SUBSCRIPTION_ID: ""
  COSTS_RESOURCE_GROUPS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetre-api
  namespace: kubetre-system
  labels: {app.kubernetes.io/name: kubetre-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: kubetre-api}
  template:
    metadata:
      # Workload identity gives the API the airlock identity's Azure token.
      labels: {app.kubernetes.io/name: kubetre-api, azure.workload.identity/use: "true"}
    spec:
      serviceAccountName: kubetre-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: kubetre/api:dev
          args:
            - --listen=:8080
            - --oidc-issuer=$(OIDC_ISSUER)
            - --oidc-audience=$(OIDC_AUDIENCE)
            - --roles-claim=$(ROLES_CLAIM)
            - --api-scope=$(API_SCOPE)
            - --gateway-url=$(GATEWAY_URL)
            - --version=$(VERSION)
            - --airlock-external-account=$(AIRLOCK_EXTERNAL_ACCOUNT)
            - --airlock-internal-account=$(AIRLOCK_INTERNAL_ACCOUNT)
            - --costs-client-id=$(COSTS_CLIENT_ID)
            - --costs-subscription-id=$(COSTS_SUBSCRIPTION_ID)
            - --costs-resource-groups=$(COSTS_RESOURCE_GROUPS)
          envFrom: [{configMapRef: {name: kubetre-api}}]
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: kubetre-api
  namespace: kubetre-system
spec:
  selector: {app.kubernetes.io/name: kubetre-api}
  ports: [{name: http, port: 80, targetPort: http}]
