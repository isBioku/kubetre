server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  # Hashed assets can be cached forever; the shell and the config must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
  location = /config.js {
    add_header Cache-Control "no-store" always;
  }
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }
  # Client-side routes (for example /workspaces/<id>) fall back to the app shell.
  location / {
    try_files $uri /index.html;
  }
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
