apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetre-controller
  namespace: kubetre-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetre-api
  namespace: kubetre-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubetre-controller
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubetre-controller}
subjects: [{kind: ServiceAccount, name: kubetre-controller, namespace: kubetre-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubetre-api
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubetre-api}
subjects: [{kind: ServiceAccount, name: kubetre-api, namespace: kubetre-system}]
---
# Leader election for the controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubetre-leader-election
  namespace: kubetre-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubetre-leader-election
  namespace: kubetre-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubetre-leader-election}
subjects: [{kind: ServiceAccount, name: kubetre-controller, namespace: kubetre-system}]
