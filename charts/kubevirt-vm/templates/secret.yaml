{{- /*
  The account's credentials. The Secret doubles as the access gateway's connection record
  (label kubetre.io/connection): SSH to this VM's Service inside the workspace namespace.
*/ -}}
{{- $name := include "kvm.name" . -}}
{{- $password := include "kvm.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-credentials
  labels: {{- include "kvm.labels" . | nindent 4 }}
    kubetre.io/connection: "true"
  annotations:
    kubetre.io/owner: {{ .Values.kubetre.owner | quote }}
type: Opaque
stringData:
  protocol: ssh
  hostname: {{ printf "%s-ssh.%s.svc.cluster.local" $name .Release.Namespace | quote }}
  port: "22"
  username: {{ .Values.username | quote }}
  password: {{ $password | quote }}
---
# cloud-init: one account for the owner with password sign-in over SSH, root locked.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-cloudinit
  labels: {{- include "kvm.labels" . | nindent 4 }}
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: {{ $name }}
    disable_root: true
    ssh_pwauth: true
    users:
      - name: {{ .Values.username }}
        shell: /bin/bash
        groups: [sudo]
        lock_passwd: false
    chpasswd:
      expire: false
      users:
        - name: {{ .Values.username }}
          password: {{ $password | toJson }}
          type: text
