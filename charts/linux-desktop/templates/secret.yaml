{{- /*
  Connection details for the access gateway (label kubetre.io/connection). The VNC password
  is generated once and kept across upgrades.
*/ -}}
{{- $name := printf "%s-vnc" (include "desktop.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 8 -}}
{{- if and $existing $existing.data }}{{ $password = index $existing.data "password" | b64dec }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "desktop.labels" . | nindent 4 }}
    kubetre.io/connection: "true"
  annotations:
    kubetre.io/owner: {{ .Values.kubetre.owner | quote }}
type: Opaque
stringData:
  protocol: vnc
  hostname: {{ printf "%s.%s.svc.cluster.local" (include "desktop.name" .) .Release.Namespace }}
  port: "5901"
  # VNC authentication uses at most 8 characters; the gateway is the real access control.
  password: {{ $password | quote }}
