---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: airlockrequests.kubetre.io
spec:
  group: kubetre.io
  names:
    kind: AirlockRequest
    listKind: AirlockRequestList
    plural: airlockrequests
    shortNames:
    - airlock
    singular: airlockrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AirlockRequest is a request to move one file into (import) or
          out of (export) a workspace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AirlockRequestSpec is what the requester asked for. It does
              not change.
            properties:
              businessJustification:
                maxLength: 4000
                type: string
              createdBy:
                description: |-
                  AirlockUser identifies who acted. ID is the Entra object ID, which AzureTRE's UI compares
                  with the signed-in account.
                properties:
                  email:
                    type: string
                  id:
                    type: string
                  name:
                    type: string
                required:
                - id
                type: object
              title:
                maxLength: 200
                minLength: 1
                type: string
              type:
                enum:
                - import
                - export
