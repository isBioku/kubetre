# Envoy Gateway configuration. Cloud overlays add load balancer settings to the EnvoyProxy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kubetre
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyService:
        type: LoadBalancer
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kubetre
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kubetre
    namespace: envoy-gateway-system
---
# HTTPS only. The certificate is the Secret kubetre-gateway-tls in this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kubetre
  namespace: kubetre-gateway
spec:
  gatewayClassName: kubetre
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: gateway.example.org
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: kubetre-gateway-tls}]
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guacamole
  namespace: kubetre-gateway
spec:
  parentRefs: [{name: kubetre}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /guacamole/}}]
      backendRefs: [{name: guacamole, port: 8080}]
      # Remote sessions are long-lived WebSocket streams.
      timeouts: {request: "0s"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: broker
  namespace: kubetre-gateway
spec:
  parentRefs: [{name: kubetre}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /gateway}}]
      backendRefs: [{name: broker, port: 8080}]
---
# AzureTRE's UI at the site root. Longer prefixes (/api/, /gateway, /guacamole/) win.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui
  namespace: kubetre-gateway
spec:
  parentRefs: [{name: kubetre}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: ui, port: 8080}]
---
# The KubeTRE API on the same hostname, under /api/: AzureTRE's API for the UI, and /api/v1.
# It validates its own OIDC tokens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: kubetre-gateway
spec:
  parentRefs: [{name: kubetre}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/}}]
      backendRefs: [{name: kubetre-api, namespace: kubetre-system, port: 80}]
---
# Lets only HTTPRoutes in kubetre-gateway reach only the kubetre-api Service.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: gateway-to-api
  namespace: kubetre-system
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: kubetre-gateway}
  to:
    - {group: "", kind: Service, name: kubetre-api}
