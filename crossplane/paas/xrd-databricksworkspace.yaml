# An Azure Databricks workspace injected into two subnets of the workspace's network, reached through private endpoints.
# Created by the azure-paas chart.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: databricksworkspaces.platform.kubetre.io
spec:
  scope: Namespaced
  group: platform.kubetre.io
  names:
    kind: DatabricksWorkspace
    plural: databricksworkspaces
  defaultCompositionRef:
    name: databricksworkspace-azure
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - parameters
            properties:
              parameters:
                type: object
                required:
                - id
                - subnets
                - firewallPriority
                properties:
                  id:
                    type: string
                    pattern: ^[a-z0-9]{10}$
                    description: Stable suffix for Azure resource names, derived by the chart from the namespace and release.
                  members:
                    type: array
                    description: Workspace owners and researchers with known Entra object IDs, granted roles on the service.
                    items:
                      type: object
                      required:
                      - objectId
                      - role
                      properties:
                        objectId:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                          - owner
                          - researcher
                  creator:
                    type: object
                    description: Who created the service.
                    properties:
                      objectId:
                        type: string
                      email:
                        type: string
                  subnets:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: string
                    description: Host and container subnets allocated by KubeTRE.
                  firewallPriority:
                    type: integer
                    minimum: 100
                    maximum: 65000
                x-kubernetes-validations:
                - rule: self.id == oldSelf.id
                  message: id is immutable
          status:
            type: object
            properties:
              endpoint:
                type: string
