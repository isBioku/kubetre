# Crossplane providers for the optional PaaS workspace services. Same version as
# crossplane/install/packages.yaml; one runtime config per provider so each runs under a fixed
# service account name, matching the federated credentials in infra/azure/paas.tf.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-azure-dbformysql
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-azure-dbformysql
      annotations:
        # Client ID of the Crossplane user-assigned identity; replaced per environment.
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-dbformysql
spec:
  package: xpkg.upbound.io/upbound/provider-azure-dbformysql:v2.7.0
  runtimeConfigRef:
    name: provider-azure-dbformysql
---
