apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetre-gateway-broker
  namespace: kubetre-gateway
---
# The broker reads workspace membership, service ownership, VM addresses and connection
# Secrets. Kubernetes RBAC cannot limit a list to labelled Secrets, so this is read access to
# Secrets cluster-wide: the broker is small, runs on the isolated gateway pool and writes
# nothing outside its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubetre-gateway-broker
rules:
  - apiGroups: ["kubetre.io"]
    resources: ["workspaces", "workspaceservices"]
    verbs: ["get", "list"]
  - apiGroups: ["platform.kubetre.io"]
    resources: ["researchvms"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubetre-gateway-broker
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubetre-gateway-broker}
subjects: [{kind: ServiceAccount, name: kubetre-gateway-broker, namespace: kubetre-gateway}]
---
# Creates and reads its own key Secret on first start.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubetre-gateway-keys
  namespace: kubetre-gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kubetre-gateway-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubetre-gateway-keys
  namespace: kubetre-gateway
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubetre-gateway-keys}
subjects: [{kind: ServiceAccount, name: kubetre-gateway-broker, namespace: kubetre-gateway}]
