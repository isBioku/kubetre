{{- /* The admin password, generated once and kept across upgrades. Nobody needs it day to
  day: researchers read anonymously, and the setup job uses it to configure repositories. */ -}}
{{- $name := printf "%s-admin" (include "nexus.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existing $existing.data }}{{ $password = index $existing.data "password" | b64dec }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "nexus.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
