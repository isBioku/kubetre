# An Azure Machine Learning workspace for a workspace, with its storage account, key vault and
# Application Insights. None has public network access: private endpoints in the workspace's
# subnet serve the API, notebooks, storage and key vault. Members get "AzureML Data Scientist"
# and storage data roles, and sign in with Entra ID.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: mlworkspace-azure
  labels:
    kubetre.io/cloud: azure
  annotations:
    # The Go templates below must reach Crossplane verbatim, untouched by Flux substitution.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  compositeTypeRef:
    apiVersion: platform.kubetre.io/v1alpha1
    kind: MLWorkspace
  mode: Pipeline
  pipeline:
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: kubetre-azure
            - type: Reference
              ref:
                name: kubetre-azure-paas
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        options: [missingkey=error]
        inline:
          template: |
            {{- $env := index .context "apiextensions.crossplane.io/environment" }}
            {{- $xr := .observed.composite.resource }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $ws := trimPrefix "ws-" $ns }}
            {{- $p := $xr.spec.parameters }}
            {{- $id := $p.id }}
            {{- $svc := index ($xr.metadata.labels | default dict) "kubetre.io/service" | default $xr.metadata.name }}
            {{- $obs := index .observed "resources" | default dict }}
            {{- $zones := $env.privateDnsZoneIds }}
            {{- $tags := dict "kubetre-workspace" $ws "kubetre-service" $svc }}
            {{- range $k, $v := (index $env "tags" | default dict) }}{{ $_ := set $tags $k $v }}{{ end }}
            {{- $members := index $p "members" | default list }}
            {{- define "observedId" }}{{ dig "resource" "status" "atProvider" "id" "" (index .obs .name | default dict) }}{{ end }}
            {{- /* A private endpoint in the workspace's VM subnet, once its target exists. */}}
            {{- define "privateEndpoint" }}
            {{- $target := include "observedId" (dict "obs" .obs "name" .target) }}
            {{- if $target }}
            ---
            apiVersion: network.azure.m.upbound.io/v1beta1
            kind: PrivateEndpoint
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ .name }}
                crossplane.io/external-name: {{ printf "pe-%s" .peName }}
            spec:
              forProvider:
                location: {{ .env.location | quote }}
                resourceGroupName: {{ .env.resourceGroup | quote }}
                subnetIdSelector:
                  matchLabels:
                    kubetre.io/workspace: {{ .ws | quote }}
                    kubetre.io/role: vm-subnet
                privateServiceConnection:
                  name: {{ printf "psc-%s" .peName | quote }}
                  isManualConnection: false
                  privateConnectionResourceId: {{ $target | quote }}
                  subresourceNames: [{{ .subresource | quote }}]
                privateDnsZoneGroup:
                  name: default
                  privateDnsZoneIds: {{ toJson .zones }}
                tags: {{ toJson .tags }}
            {{- end }}
            {{- end }}
            {{- /* Roles for workspace members on a composed resource, once it exists. */}}
            {{- define "roleAssignments" }}
            {{- $scope := include "observedId" (dict "obs" .obs "name" .target) }}
            {{- if $scope }}
            {{- $ctx := . }}
            {{- range $m := .members }}
            {{- if or (eq $m.role "owner") (not (index $ctx "ownersOnly")) }}
            {{- range $key, $role := $ctx.roles }}
            ---
            apiVersion: authorization.azure.m.upbound.io/v1beta1
            kind: RoleAssignment
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "role-%s-%s-%s" $ctx.target $key ($m.objectId | trunc 8) }}
            spec:
              forProvider:
                principalId: {{ $m.objectId | quote }}
                principalType: User
                roleDefinitionName: {{ $role | quote }}
                scope: {{ $scope | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Where the workspace's machines reach the service, for the API to show. */}}
            {{- define "connection" }}
            ---
            apiVersion: v1
            kind: Service
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection
                kubetre.io/connection-uri: {{ .uri | quote }}
                {{- with .details }}
                kubetre.io/details: {{ toJson . | quote }}
                {{- end }}
              labels:
                kubetre.io/service: {{ .svc | quote }}
            spec:
              type: ExternalName
              externalName: {{ .host | quote }}
            {{- end }}
            {{- $mlw := printf "mlw-%s" $id }}
            {{- $st := printf "stml%s" $id }}
            {{- $kv := printf "kv-ml-%s" $id }}
            ---
            apiVersion: storage.azure.m.upbound.io/v1beta1
            kind: Account
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: storage
                crossplane.io/external-name: {{ $st }}
            spec:
              forProvider:
                location: {{ $env.location | quote }}
                resourceGroupName: {{ $env.resourceGroup | quote }}
                accountTier: Standard
                accountReplicationType: ZRS
                minTlsVersion: TLS1_2
                publicNetworkAccessEnabled: false
                allowNestedItemsToBePublic: false
                infrastructureEncryptionEnabled: true
                tags: {{ toJson $tags }}
            ---
            apiVersion: keyvault.azure.m.upbound.io/v1beta1
            kind: Vault
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vault
                crossplane.io/external-name: {{ $kv }}
            spec:
              forProvider:
                location: {{ $env.location | quote }}
                resourceGroupName: {{ $env.resourceGroup | quote }}
                tenantId: {{ $env.tenantId | quote }}
                skuName: standard
                rbacAuthorizationEnabled: true
                publicNetworkAccessEnabled: false
                softDeleteRetentionDays: 7
                purgeProtectionEnabled: false
                tags: {{ toJson $tags }}
            ---
            apiVersion: insights.azure.m.upbound.io/v1beta1
            kind: ApplicationInsights
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: insights
                crossplane.io/external-name: {{ printf "appi-ml-%s" $id }}
            spec:
              forProvider:
                location: {{ $env.location | quote }}
                resourceGroupName: {{ $env.resourceGroup | quote }}
                applicationType: web
                workspaceId: {{ $env.logAnalyticsWorkspaceId | quote }}
                localAuthenticationDisabled: true
                tags: {{ toJson $tags }}
            ---
            apiVersion: machinelearningservices.azure.m.upbound.io/v1beta1
            kind: Workspace
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: workspace
                crossplane.io/external-name: {{ $mlw }}
              labels:
                # Compute instances find their workspace by this service's name.
                kubetre.io/service: {{ $svc | quote }}
            spec:
              forProvider:
                location: {{ $env.location | quote }}
                resourceGroupName: {{ $env.resourceGroup | quote }}
                friendlyName: {{ $svc | quote }}
                identity:
                  type: SystemAssigned
                storageAccountIdSelector:
                  matchControllerRef: true
                keyVaultIdSelector:
                  matchControllerRef: true
                applicationInsightsIdSelector:
                  matchControllerRef: true
                publicNetworkAccessEnabled: false
                highBusinessImpact: true
                v1LegacyModeEnabled: false
                tags: {{ toJson $tags }}
            {{- template "privateEndpoint" (dict "obs" $obs "target" "workspace" "name" "endpoint" "peName" $mlw "subresource" "amlworkspace" "zones" (list $zones.azureml $zones.notebooks) "env" $env "ws" $ws "tags" $tags) }}
            {{- template "privateEndpoint" (dict "obs" $obs "target" "storage" "name" "endpoint-blob" "peName" (printf "%s-blob" $st) "subresource" "blob" "zones" (list $zones.blob) "env" $env "ws" $ws "tags" $tags) }}
            {{- template "privateEndpoint" (dict "obs" $obs "target" "storage" "name" "endpoint-file" "peName" (printf "%s-file" $st) "subresource" "file" "zones" (list $zones.file) "env" $env "ws" $ws "tags" $tags) }}
            {{- template "privateEndpoint" (dict "obs" $obs "target" "vault" "name" "endpoint-vault" "peName" $kv "subresource" "vault" "zones" (list $zones.vault) "env" $env "ws" $ws "tags" $tags) }}
            {{- template "roleAssignments" (dict "obs" $obs "target" "workspace" "members" $members "roles" (dict "ds" "AzureML Data Scientist")) }}
            {{- template "roleAssignments" (dict "obs" $obs "target" "storage" "members" $members "roles" (dict "blob" "Storage Blob Data Contributor" "file" "Storage File Data Privileged Contributor")) }}
            {{- $mlId := include "observedId" (dict "obs" $obs "name" "workspace") }}
            {{- $uri := "https://ml.azure.com/" }}
            {{- if $mlId }}{{ $uri = printf "https://ml.azure.com/?wsid=%s" $mlId }}{{ end }}
            {{- template "connection" (dict "svc" $svc "host" "ml.azure.com" "uri" $uri "details" (dict "workspace" $mlw "authentication" "Microsoft Entra ID")) }}
