# An Azure Machine Learning workspace with its storage, key vault and Application Insights, all reached through private endpoints in the workspace's subnet.
# Created by the azure-paas chart.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: mlworkspaces.platform.kubetre.io
spec:
  scope: Namespaced
  group: platform.kubetre.io
  names:
    kind: MLWorkspace
    plural: mlworkspaces
  defaultCompositionRef:
    name: mlworkspace-azure
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - parameters
            properties:
              parameters:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    pattern: ^[a-z0-9]{10}$
                    description: Stable suffix for Azure resource names, derived by the chart from the namespace and release.
                  members:
                    type: array
                    description: Workspace owners and researchers with known Entra object IDs, granted roles on the service.
                    items:
                      type: object
                      required:
                      - objectId
                      - role
                      properties:
                        objectId:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                          - owner
                          - researcher
                  creator:
                    type: object
                    description: Who created the service.
                    properties:
                      objectId:
                        type: string
                      email:
                        type: string
                x-kubernetes-validations:
                - rule: self.id == oldSelf.id
                  message: id is immutable
          status:
            type: object
            properties:
              endpoint:
                type: string
