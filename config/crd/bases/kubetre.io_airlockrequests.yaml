                      - id
                      type: object
                    when:
                      format: date-time
                      type: string
                  required:
                  - decision
                  - id
                  - reviewer
                  - when
                  type: object
                type: array
              scanResult:
                description: AirlockScanResult is the malware scanner's verdict on
                  the request's file.
                properties:
                  clean:
                    type: boolean
                  message:
                    type: string
                required:
                - clean
                type: object
              status:
                type: string
              statusMessage:
                type: string
              updatedBy:
                description: |-
                  AirlockUser identifies who acted. ID is the Entra object ID, which AzureTRE's UI compares
